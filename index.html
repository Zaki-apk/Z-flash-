<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zaki vs Moumen — Realistic FPS Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}
.card{min-width:150px;padding:9px 12px;border-radius:10px;background:rgba(7,9,12,.62);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.hp{height:7px;margin-top:6px;border-radius:20px;background:#292d31;overflow:hidden}.hp>i{display:block;width:100%;height:100%;background:#39c875}
#cross{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);opacity:.92}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}.cross:before{left:0;right:0;top:13px;height:2px}.cross:after{top:0;bottom:0;left:13px;width:2px}
#info{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-weight:800;text-shadow:0 2px 8px #000}
#weapon{position:absolute;right:18px;bottom:150px;display:flex;gap:7px;pointer-events:auto}
button{border:1px solid rgba(255,255,255,.22);background:rgba(5,7,10,.68);color:#fff;border-radius:10px;padding:10px 13px;font-weight:700}
button.active{outline:2px solid #fff}
#fire{position:absolute;right:22px;bottom:30px;width:92px;height:92px;border-radius:50%;background:rgba(190,55,55,.72);pointer-events:auto}
#stick{position:absolute;left:22px;bottom:25px;width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.18);pointer-events:auto}
#knob{position:absolute;width:55px;height:55px;left:34px;top:34px;border-radius:50%;background:rgba(255,255,255,.27)}
#reload{position:absolute;right:24px;bottom:133px;pointer-events:auto}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#ddd;white-space:nowrap}
@media(max-width:600px){.card{min-width:125px;font-size:12px}.top{top:8px;left:8px;right:8px}#hint{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="card"><b id="pname">زاكي</b><div class="hp"><i id="php"></i></div><small>الصحة <span id="pnum">100</span></small></div>
    <div class="card">الجولة <b id="round">1</b><br>النتيجة <b id="score">0</b></div>
    <div class="card"><b id="ename">مومن</b><div class="hp"><i id="ehp"></i></div><small>الخصم <span id="enum">100</span></small></div>
  </div>
  <div id="info">ساحة تدريب 1 ضد 1</div>
  <div id="cross"></div>
  <div id="weapon"><button data-w="smg" class="active">SMG</button><button data-w="scatter">موجة</button></div>
  <button id="reload">إعادة</button>
  <button id="fire">إطلاق</button>
  <div id="stick"><div id="knob"></div></div>
  <div id="hint">اسحب الشاشة للنظر • العصا للحركة • إطلاق للهجوم</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x11161b);
scene.fog=new THREE.Fog(0x11161b,16,38);

const camera=new THREE.PerspectiveCamera(73,innerWidth/innerHeight,.05,100);
camera.position.set(0,1.68,6.8);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.querySelector("#game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcbdcff,0x263039,1.8));
const sun=new THREE.DirectionalLight(0xfff3dc,2.6);
sun.position.set(-5,10,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(24,24),
 new THREE.MeshStandardMaterial({color:0x3a3d3f,roughness:.94,metalness:.02})
);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

function box(x,y,z,w,h,d,c,rough=.8){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:rough}));
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
box(0,2,-5,20,4,.35,0x555b61);
box(-10,2,0,.35,4,10,0x555b61);
box(10,2,0,.35,4,10,0x555b61);
box(0,2,5,20,4,.35,0x555b61);
box(-3.8,1,-1.0,2.4,2,1.2,0x66635c);
box(3.6,1,.9,2.4,2,1.2,0x66635c);
box(0,.65,-1.8,3.2,1.3,.9,0x4f565b);
box(-6,.55,2.6,1.5,1.1,1.5,0x4b5155);
box(6,.55,-2.5,1.5,1.1,1.5,0x4b5155);

const grid=new THREE.GridHelper(20,20,0x555b60,0x454a4e);
grid.position.y=.006;scene.add(grid);

const loader=new THREE.TextureLoader();
function fighter(name,url,x,z){
 const g=new THREE.Group();g.position.set(x,0,z);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.95,6,10),new THREE.MeshStandardMaterial({color:0x25364a,roughness:.8}));
 body.position.y=.82;body.castShadow=true;g.add(body);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.16,.17,.25,12),new THREE.MeshStandardMaterial({color:0x8d5e47}));
 neck.position.y=1.52;g.add(neck);
 const faceMat=new THREE.MeshBasicMaterial({map:loader.load(url),side:THREE.DoubleSide});
 const face=new THREE.Mesh(new THREE.PlaneGeometry(.72,.82),faceMat);
 face.position.set(0,1.98,.01);g.add(face);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.38,.18,.12),new THREE.MeshStandardMaterial({color:0x171717,roughness:.65}));
 hair.scale.y=.45;hair.position.y=2.28;hair.castShadow=true;g.add(hair);
 scene.add(g);return {name,g,hp:100};
}
let player=fighter("زاكي","assets/zaki.jpg",0,6.8);
let enemy=fighter("مومن","assets/moumen.jpg",0,-2.4);
player.g.visible=false;

const state={weapon:"smg",score:0,round:1,over:false,playerHP:100,enemyHP:100,mag:24,fireCooldown:0};
const keys={};let mx=0,my=0,yaw=0,pitch=0,drag=false,lastX=0,lastY=0;

const $=s=>document.querySelector(s);
function hud(){
 $("#pname").textContent=player.name;$("#ename").textContent=enemy.name;
 $("#pnum").textContent=state.playerHP;$("#enum").textContent=state.enemyHP;
 $("#php").style.width=state.playerHP+"%";$("#ehp").style.width=state.enemyHP+"%";
 $("#score").textContent=state.score;$("#round").textContent=state.round;
}
function reset(){
 state.playerHP=100;state.enemyHP=100;state.mag=24;state.over=false;
 player.g.position.set(0,0,6.8);enemy.g.position.set(0,0,-2.4);
 $("#info").textContent="ساحة تدريب 1 ضد 1";hud();
}
function look(dx,dy){yaw-=dx*.004;pitch=THREE.MathUtils.clamp(pitch-dy*.003,-1.22,1.22);camera.rotation.set(pitch,yaw,0)}
renderer.domElement.addEventListener("pointerdown",e=>{drag=true;lastX=e.clientX;lastY=e.clientY;try{renderer.domElement.setPointerCapture(e.pointerId)}catch{}});
renderer.domElement.addEventListener("pointermove",e=>{if(!drag)return;look(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY});
renderer.domElement.addEventListener("pointerup",()=>drag=false);renderer.domElement.addEventListener("pointercancel",()=>drag=false);

const stick=$("#stick"),knob=$("#knob");let sid=null;
function stickSet(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=48,k=len>max?max/len:1;mx=dx*k/max;my=dy*k/max;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}
function stickReset(){sid=null;mx=my=0;knob.style.transform="translate(0,0)"}
stick.addEventListener("pointerdown",e=>{sid=e.pointerId;stick.setPointerCapture(sid);stickSet(e)});
stick.addEventListener("pointermove",e=>{if(e.pointerId===sid)stickSet(e)});
stick.addEventListener("pointerup",stickReset);stick.addEventListener("pointercancel",stickReset);

document.querySelectorAll("[data-w]").forEach(b=>b.addEventListener("click",()=>{
 state.weapon=b.dataset.w;document.querySelectorAll("[data-w]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
}));
$("#reload").addEventListener("click",()=>state.mag=24);

function fire(){
 if(state.over){reset();return}
 if(state.fireCooldown>0||state.mag<=0)return;
 state.mag--;state.fireCooldown=state.weapon==="smg"?.105:.42;
 const origin=camera.position.clone(),dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize();
 const target=enemy.g.position.clone();target.y=1.65;
 const to=target.clone().sub(origin),dist=to.length(),ang=dir.angleTo(to.normalize());
 const range=state.weapon==="smg"?19:10;
 const tol=state.weapon==="smg"?.075:.15;
 if(dist<range&&ang<tol){
   state.enemyHP=Math.max(0,state.enemyHP-(state.weapon==="smg"?10:27));
   enemy.g.scale.set(1.08,.94,1.08);setTimeout(()=>enemy.g.scale.set(1,1,1),70);
   if(state.enemyHP===0){state.score++;state.over=true;$("#info").textContent="انتهت الجولة — اضغط إطلاق للجولة التالية"}
 }
 hud();
}
$("#fire").addEventListener("pointerdown",fire);
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")fire()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let aiTime=0;
function ai(dt){
 if(state.over)return;
 aiTime+=dt;
 enemy.g.position.x=Math.sin(aiTime*.75)*3.6;
 enemy.g.position.z=-2.4+Math.cos(aiTime*.43)*.8;
 enemy.g.lookAt(camera.position.x,1.2,camera.position.z);
 if(Math.random()<dt*.11&&enemy.g.position.distanceTo(camera.position)<13){
   state.playerHP=Math.max(0,state.playerHP-7);
   if(state.playerHP===0){state.over=true;$("#info").textContent="انتهت الجولة — اضغط إطلاق لإعادة اللعب"}
   hud();
 }
}
function move(dt){
 let x=mx,y=my;
 if(keys.w)y=-1;if(keys.s)y=1;if(keys.a)x=-1;if(keys.d)x=1;
 const speed=4.1,forward=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));
 camera.position.addScaledVector(forward,-y*speed*dt);camera.position.addScaledVector(right,x*speed*dt);
 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-8.7,8.7);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-3.9,4.2);camera.position.y=1.68;
}
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;
 state.fireCooldown=Math.max(0,state.fireCooldown-dt);
 if(!state.over)move(dt);ai(dt);renderer.render(scene,camera);
}
hud();loop(last);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
